name: Current Gateway Dashboard Screenshot

on:
  push:
    branches:
      - preview/current-gateway-dashboard
    paths:
      - .github/workflows/current-dashboard-screenshot.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: preview/current-gateway-dashboard
      - name: Install browser
        run: npx --yes playwright@1.55.0 install --with-deps chromium
      - name: Capture desktop and mobile
        run: |
          mkdir -p .preview
          npx --yes playwright@1.55.0 screenshot --browser chromium --viewport-size="1440,1000" --full-page https://swiftpay-front-oasrcyovm-swifteam.vercel.app .preview/current-dashboard-desktop.png
          npx --yes playwright@1.55.0 screenshot --browser chromium --device="Pixel 5" --full-page https://swiftpay-front-oasrcyovm-swifteam.vercel.app .preview/current-dashboard-mobile.png
      - name: Commit screenshots
        run: |
          git config user.name "swiftpay-preview-bot"
          git config user.email "swiftpay-preview-bot@users.noreply.github.com"
          git add .preview/current-dashboard-desktop.png .preview/current-dashboard-mobile.png
          git commit -m "docs(preview): capture current gateway dashboard" || exit 0
          git push origin HEAD:preview/current-gateway-dashboard
